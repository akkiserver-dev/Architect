name: Publish Otogi guide

on:
  push:
    branches:
      - master
    paths:
      - 'docs/public/**'
      - '.github/workflows/publish-guide.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stage public guide
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path _site/assets/fonts | Out-Null
          Copy-Item -LiteralPath ('docs/public/index.html', 'docs/public/abilities.html', 'docs/public/server-guide.html') -Destination _site
          Copy-Item -LiteralPath ('docs/public/guide.md', 'docs/public/abilities.md', 'docs/public/server-guide.md') -Destination _site
          Copy-Item -LiteralPath ('docs/public/assets/book.css', 'docs/public/assets/book.js', 'docs/public/assets/mark.svg') -Destination _site/assets
          Copy-Item -LiteralPath ('docs/public/assets/fonts/DotGothic16-Regular.ttf', 'docs/public/assets/fonts/OFL.txt') -Destination _site/assets/fonts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
